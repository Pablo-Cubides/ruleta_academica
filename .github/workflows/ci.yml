name: CI

on:
  push:
    branches:
      - main
      - chore/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (use legacy peer deps to match local install)
        run: |
          npm install --legacy-peer-deps
        # Using --legacy-peer-deps here mirrors the local dev install and
        # avoids CI failing on peer dependency conflicts (e.g. testing libs
        # that currently require React 18 while the project uses React 19).

      - name: Generate Prisma Client
        run: |
          npx prisma generate
        env:
          # Provide a fallback DATABASE_URL so prisma generate does not fail when the DB secret is not configured in CI
          DATABASE_URL: "file:./dev.db"

      - name: Lint
        run: |
          npm run lint

      - name: Build
        run: |
          npm run build
        env:
          # SENTRY_DSN is optional for CI runs; if the secret is not set this will be empty
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    timeout-minutes: 20
